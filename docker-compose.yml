version: "3.9"

services:
  kali-bot:
    build: .
    image: bottel-kali:latest
    container_name: bottel_kali
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./results:/app/results        # Scan output persistence
      - ./wordlists:/app/wordlists    # Custom wordlists
    network_mode: host                # Full network access for scanning tools
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:false       # Required for some Kali tools (e.g. nmap -O)

  # Optional: standalone Kali shell for manual use
  kali-shell:
    image: kalilinux/kali-rolling:latest
    container_name: kali_shell
    stdin_open: true
    tty: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    profiles:
      - shell                         # Only start with: docker compose --profile shell up
